        $(document).ready(function () {

                async: false,
                dataType: "json",
                url: "http://localhost:8082/api/TaipeiGate/GetTaipeiGate",
                contentType: "application/json; charset=utf-8",
                success: function (data) {
                    /*

                    var table = $("<table>").appendTo("body");
                    var rows = [];
                    var previousCity = "";

                    $.each(data, function (index, item) {
                        var row = $("<tr>");

                        if (item.city === previousCity) {
                            row.append("<td></td>");
                        } else {
                            var rowspan = data.filter(function (item) {
                                return item.city === item.city;
                            }).length;

                            row.append("<td rowspan='" + rowspan + "'>" + item.city + "</td>");
                            previousCity = item.city;
                        }

                        row.append("<td>" + item.sensorNamA + "</td>");
                        row.append("<td>" + item.lastTime + "</td>");
                        row.append("<td>" + item.gateValue + "</td>");

                        rows.push(row);
                    });

                    table.append(rows);
                    const csvData = '\ufeff' +convertToCsv(data);

                    // Create a Blob object from the CSV string
                    const blob = new Blob([csvData], { type: 'text/csv;' });

                    // Create a temporary URL for the Blob
                    const url = URL.createObjectURL(blob);

                    // Create a link element
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'data.csv'; // Set the desired file name

                    // Append the link to the document body
                    document.body.appendChild(link);

                    // Click the link to trigger the file download
                    link.click();

                    // Remove the link from the document body
                    document.body.removeChild(link);

                }, //End of AJAX Success function  

                failure: function (data) {
                    alert('f:' + data);
                }, //End of AJAX failure function  
                error: function (xhr, status, error) {
                    alert('e'+error);
                    var errorMessage = xhr.responseText;
                    alert(errorMessage);
                }

                                alert(key + ": " + value);
                        }
                    }
                }
                */

            });
        });
        //});

        function convertToCsv(data) {
            // Convert array of objects to CSV string
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(obj => Object.values(obj).join(','));
            return headers + '\n' + rows.join('\n');
        }

        function convertToCsv2(data) {
            // Convert array of objects to CSV string with Big5 encoding
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(obj => Object.values(obj).join(','));
            const csvContent = headers + '\n' + rows.join('\n');

            // Convert CSV string from UTF-8 to Big5 encoding
            const utf8Encoder = new TextEncoder('UTF-8');
            const big5Decoder = new TextDecoder('big5');
            const utf8Data = utf8Encoder.encode(csvContent);
            const big5Data = big5Decoder.decode(utf8Data);
            //alert(big5Data);
            return big5Data;
        }
    </script>
