                        tbody.innerHTML += "<tr><td>" + data.sensorName + "</td>" + "<td>" + data.lastTime + "</td>" + "<td>" + data.gateValue + "</td></tr>";
                    });

        function convertToCsv(data) {
            // Convert array of objects to CSV string
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(obj => Object.values(obj).join(','));
            return headers + '\n' + rows.join('\n');
        }

        function convertToCsv2(data) {
            // Convert array of objects to CSV string with Big5 encoding
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(obj => Object.values(obj).join(','));
            const csvContent = headers + '\n' + rows.join('\n');

            // Convert CSV string from UTF-8 to Big5 encoding
            const utf8Encoder = new TextEncoder('UTF-8');
            const big5Decoder = new TextDecoder('big5');
            const utf8Data = utf8Encoder.encode(csvContent);
            const big5Data = big5Decoder.decode(utf8Data);
            //alert(big5Data);
            return big5Data;
        }
